<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单域类图 · 结构级</title>
<style>
  :root{
    --bg:#F8FAFC; --ink:#1E293B; --sub:#64748B;
    --mono:"Cascadia Code","JetBrains Mono",Consolas,monospace;
    --sans:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);
    background-image:radial-gradient(#CBD5E1 1px,transparent 1px);background-size:24px 24px;}

  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 28px;background:#fff;border-bottom:1px solid #EDF1F6;position:sticky;top:0;z-index:20;
    box-shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.04)}
  header h1{font-size:19px;font-weight:700;letter-spacing:.5px;padding-left:13px;position:relative}
  header h1::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,#475569,#334155)}
  header .meta{font-size:12px;color:var(--sub);background:#F8FAFC;border:1px solid #E2E8F0;
    border-radius:99px;padding:3px 12px}
  .spacer{flex:1}
  .btn{font-size:12.5px;padding:6px 15px;border-radius:99px;border:1px solid #D9E1EA;background:#fff;
    color:#334155;cursor:pointer;transition:all .15s}
  .btn:hover{border-color:#94A3B8;background:#F1F5F9}
  .btn.primary{background:linear-gradient(180deg,#475569,#334155);color:#fff;border-color:#334155;
    box-shadow:0 2px 8px rgba(51,65,85,.25)}
  .btn.primary:hover{background:linear-gradient(180deg,#526179,#3E4C62)}

  #canvas{position:relative;padding:36px 44px 16px;width:fit-content;max-width:96vw;min-width:960px;margin:0 auto}
  #edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  #elabels{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
  #elabels text{transition:opacity .15s}
  .row{position:relative;z-index:2;display:flex;align-items:flex-start;justify-content:center;gap:34px;
    margin-bottom:58px;flex-wrap:wrap}

  .cls{width:252px;background:#fff;border:1.5px solid #E2E8F0;border-radius:10px;overflow:hidden;
    box-shadow:0 1px 3px rgba(15,23,42,.08);transition:box-shadow .18s,transform .18s;cursor:pointer;position:relative}
  .cls:hover{box-shadow:0 6px 18px rgba(15,23,42,.14);transform:translateY(-2px)}
  .cls::before{content:"";display:block;height:4px;background:var(--c,#94A3B8)}
  .cls .head{padding:10px 14px 8px;border-bottom:1px solid #F1F5F9}
  .cls.folded .head{padding:8px 14px 8px;border-bottom:none}
  .cls .stereo{display:inline-flex;gap:6px;align-items:center;font-size:11px;padding:2px 9px;border-radius:99px;
    background:color-mix(in srgb,var(--c) 10%,white);color:var(--c);font-weight:600;margin-bottom:6px}
  .cls .name{font-size:15.5px;font-weight:700;font-family:var(--mono);letter-spacing:.2px}
  .cls .desc{font-size:12px;color:var(--sub);font-style:italic;margin-top:5px;line-height:1.5}
  .cls .body{padding:8px 14px 12px;display:block}
  .cls.semi .body,.cls.folded .body{display:none}
  .cls.folded .desc{display:none}
  .sect{font-size:10.5px;font-weight:700;color:#94A3B8;letter-spacing:2px;margin:8px 0 4px}
  .sect:first-child{margin-top:2px}
  .member{font-family:var(--mono);font-size:12px;line-height:1.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .member .vis{display:inline-block;width:14px;font-weight:700}
  .vis.pub{color:#16A34A}.vis.pri{color:#DC2626}.vis.pro{color:#D97706}.vis.pkg{color:#64748B}
  .member .static{text-decoration:underline;text-underline-offset:3px}
  .member.abstract-m{font-style:italic}
  .member .rtype{color:#94A3B8}
  .ellip{font-size:11px;color:#B0B8C4;font-style:italic;padding:2px 0 0}
  .fold-hint{font-size:10.5px;color:#B6BFCC;font-style:italic;padding:5px 14px 9px;display:none}
  .cls.semi .fold-hint{display:block}
  .cls .tier-dot{position:absolute;top:9px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--c);opacity:.75}
  .cls.semi .tier-dot{opacity:.4}.cls.folded .tier-dot{opacity:.18}
  .cls.dim{opacity:.28;filter:saturate(.4)}
  .cls.hl{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent),0 6px 18px rgba(15,23,42,.14)}

  .legend{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:14px 20px;
    box-shadow:0 1px 3px rgba(15,23,42,.06)}
  /* 侧边图例浮球：悬停展开说明面板 */
  #legend-ball{position:fixed;right:20px;bottom:26px;z-index:60;width:44px;height:44px;border-radius:50%;
    background:linear-gradient(180deg,#475569,#334155);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(15,23,42,.28);transition:transform .18s,box-shadow .18s;cursor:default}
  #legend-ball:hover{transform:translateY(-2px) scale(1.06);box-shadow:0 10px 26px rgba(15,23,42,.34)}
  #legend-ball .legend{position:absolute;right:54px;bottom:-4px;width:356px;
    opacity:0;visibility:hidden;transform:translateY(8px);pointer-events:none;
    transition:opacity .18s,transform .18s,visibility .18s;
    box-shadow:0 12px 36px rgba(15,23,42,.18)}
  #legend-ball:hover .legend{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
  .legend .rowL{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center;font-size:12px;color:#475569}
  .legend .rowL+.rowL{margin-top:8px}
  .chip{display:inline-flex;align-items:center;gap:6px}
  .chip .sw{width:12px;height:12px;border-radius:4px}
  .lg-title{font-weight:700;color:#334155}
  .note-line{color:#94A3B8;font-size:11.5px;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>订单域类图</h1>
  <span class="meta">结构级 L2 · 11 类 · 12 条关系（全量）</span>
  <div class="spacer"></div>
  <button class="btn" onclick="setAll('expanded')">全部展开</button>
  <button class="btn" onclick="setAll('semi')">全部收起</button>
  <button class="btn primary" onclick="smartTier()">智能折叠</button>
</header>

<div id="canvas">
  <svg id="edges"></svg>
  <div id="rows"></div>
</div>

<div id="legend-ball" aria-label="图例与操作说明">
  <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
    <path d="M7.1 7.2c.15-1.35 1.25-2.2 2.75-2.2 1.6 0 2.75 1 2.75 2.35 0 1.05-.55 1.65-1.55 2.3-.85.55-1.15.95-1.15 1.75v.35" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="9.9" cy="14.9" r="1.15" fill="#fff"/>
  </svg>
  <div class="legend">
    <div class="rowL">
      <span class="lg-title">构造型</span>
      <span class="chip"><span class="sw" style="background:#EA580C"></span>«控制器 Controller»</span>
      <span class="chip"><span class="sw" style="background:#D97706"></span>«服务 Service»</span>
      <span class="chip"><span class="sw" style="background:#0891B2"></span>«接口 Interface»</span>
      <span class="chip"><span class="sw" style="background:#7C3AED"></span>«抽象 Abstract»</span>
      <span class="chip"><span class="sw" style="background:#0D9488"></span>«仓储 Repository»</span>
      <span class="chip"><span class="sw" style="background:#16A34A"></span>«实体 Entity»</span>
      <span class="chip"><span class="sw" style="background:#475569"></span>«枚举 Enum»</span>
      <span class="chip"><span class="sw" style="background:#737373"></span>«外部 External»</span>
    </div>
    <div class="rowL">
      <span class="lg-title">关系</span>
      <svg width="46" height="14"><line x1="2" y1="7" x2="36" y2="7" stroke="#64748B" stroke-width="1.6"/><path d="M36,2 L44,7 L36,12 Z" fill="#fff" stroke="#64748B" stroke-width="1.4"/></svg>继承（指向父类）
      <svg width="46" height="14"><line x1="2" y1="7" x2="36" y2="7" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M36,2 L44,7 L36,12 Z" fill="#fff" stroke="#64748B" stroke-width="1.4"/></svg>实现
      <svg width="52" height="14"><path d="M2,7 L10,3 L18,7 L10,11 Z" fill="#64748B"/><line x1="18" y1="7" x2="50" y2="7" stroke="#64748B" stroke-width="1.6"/></svg>组合（菱形在整体端）
      <svg width="52" height="14"><path d="M2,7 L10,3 L18,7 L10,11 Z" fill="#fff" stroke="#64748B" stroke-width="1.4"/><line x1="18" y1="7" x2="50" y2="7" stroke="#64748B" stroke-width="1.6"/></svg>聚合
      <svg width="40" height="14"><line x1="2" y1="7" x2="32" y2="7" stroke="#64748B" stroke-width="1.6"/><path d="M32,2 L39,7 L32,12" fill="none" stroke="#64748B" stroke-width="1.6"/></svg>关联
      <svg width="40" height="14"><line x1="2" y1="7" x2="32" y2="7" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M32,2 L39,7 L32,12" fill="none" stroke="#64748B" stroke-width="1.6"/></svg>依赖
    </div>
    <div class="note-line">点击类卡片切换：展开 ⇄ 半折叠（仅描述）⇄ 折叠（仅类名）· 悬停高亮该类全部关系 · 智能折叠按关系重要性自动分档</div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   ███ AI 数据区开始：生成类图时只替换本区（title 标签、header 的
   h1/meta 文案、STEREO 固定不动、MODEL 的 rows/classes/edges）。
   数据格式规范见 references/class-diagram-json.md。
   ═══════════════════════════════════════════════════════════════ */
const STEREO = {
  controller:{zh:"控制器",en:"Controller",c:"#EA580C"},
  service:{zh:"服务",en:"Service",c:"#D97706"},
  interface:{zh:"接口",en:"Interface",c:"#0891B2"},
  abstract:{zh:"抽象",en:"Abstract",c:"#7C3AED"},
  repository:{zh:"仓储",en:"Repository",c:"#0D9488"},
  entity:{zh:"实体",en:"Entity",c:"#16A34A"},
  enum:{zh:"枚举",en:"Enum",c:"#475569"},
  external:{zh:"外部",en:"External",c:"#737373"},
};

const MODEL = {
  rows:[ /* 行仅为水平排布组；同类聚拢、父类在子类左侧/上方 */
    ["OrderController","OrderService"],
    ["DiscountPolicy","MemberDiscount","FestivalDiscount"],
    ["Order","OrderItem","Customer","OrderStatus"],
    ["PaymentGateway","StripeGateway","OrderRepository"],
  ],
  classes:{
    OrderController:{stereo:"controller",name:"OrderController",tier:"semi",
      desc:"订单入口：接收请求并委派服务",
      members:[["sect","方法"],["+m","placeOrder(cmd)","Response"],["+m","cancel(orderId)",""]]},
    OrderService:{stereo:"service",name:"OrderService",tier:"expanded",
      desc:"订单创建与支付编排的用例层",
      members:[["sect","属性"],["-f","orderRepository","仓储"],["-f","paymentGateway","接口"],["-f","policies","策略列表"],
               ["sect","核心方法"],["+m","placeOrder(cmd)","Order"],["+m","cancel(orderId)",""],["ellip","…其余方法省略"]]},
    DiscountPolicy:{stereo:"abstract",name:"DiscountPolicy",tier:"semi",
      desc:"折扣策略基类，子类实现计价",
      members:[["sect","方法"],["+m","applicableTo(o)","bool"],["~am","calc(o)","Money"]]},
    MemberDiscount:{stereo:"entity",name:"MemberDiscount",tier:"folded",
      desc:"会员折扣：按比例计价",
      members:[["sect","方法"],["+m","calc(o)","Money"]]},
    FestivalDiscount:{stereo:"entity",name:"FestivalDiscount",tier:"folded",
      desc:"节日折扣：满减计价",
      members:[["sect","方法"],["+m","calc(o)","Money"]]},
    Order:{stereo:"entity",name:"Order",tier:"expanded",
      desc:"聚合根：级联管理订单项生命周期",
      members:[["sect","属性"],["-f","id","String"],["-f","status","OrderStatus"],["-f","totalAmount","Money"],
               ["sect","核心方法"],["=m","create(cid)","Order"],["+m","place()",""],["+m","pay(gw)",""],["+m","cancel()",""]]},
    OrderItem:{stereo:"entity",name:"OrderItem",tier:"folded",
      desc:"订单行：数量与单价",
      members:[["sect","属性"],["-f","productId",""],["-f","quantity","int"],["-f","unitPrice","Money"]]},
    Customer:{stereo:"entity",name:"Customer",tier:"semi",
      desc:"下单主体，聚合并持有订单",
      members:[["sect","属性"],["-f","customerId",""],["-f","orders","List<Order>"]]},
    OrderStatus:{stereo:"enum",name:"OrderStatus",tier:"folded",
      desc:"订单状态字面量",
      members:[["lit","PENDING"],["lit","PAID"],["lit","CANCELLED"]]},
    PaymentGateway:{stereo:"interface",name:"PaymentGateway",tier:"expanded",
      desc:"支付契约：屏蔽第三方差异",
      members:[["sect","方法"],["+m","charge(order)","PayResult"],["+m","refund(pid)","RefundResult"],["+sm","supportedCurrencies()","Set"]]},
    StripeGateway:{stereo:"external",name:"StripeGateway",tier:"folded",
      desc:"第三方支付 SDK 适配器",
      members:[["sect","方法"],["+m","charge(order)","PayResult"]]},
    OrderRepository:{stereo:"repository",name:"OrderRepository",tier:"semi",
      desc:"订单持久化与查询",
      members:[["sect","方法"],["+m","findById(id)","Order?"],["+m","save(order)",""]]},
  },
  edges:[
    /* 继承（全量显示，父在左） */
    {from:"MemberDiscount",to:"DiscountPolicy",kind:"general"},
    {from:"FestivalDiscount",to:"DiscountPolicy",kind:"general"},
    /* 实现 */
    {from:"StripeGateway",to:"PaymentGateway",kind:"impl",label:"实现"},
    /* 组合 / 聚合 */
    {from:"Order",to:"OrderItem",kind:"compose",label:"包含",multFrom:"1",multTo:"1..*"},
    {from:"Customer",to:"Order",kind:"aggregate",label:"下单",multFrom:"1",multTo:"0..*"},
    /* 关联 */
    {from:"OrderController",to:"OrderService",kind:"assoc",label:"委派"},
    {from:"OrderService",to:"OrderRepository",kind:"assoc"},
    {from:"OrderService",to:"PaymentGateway",kind:"assoc",label:"支付"},
    {from:"OrderService",to:"DiscountPolicy",kind:"assoc",label:"应用策略"},
    {from:"Order",to:"OrderStatus",kind:"assoc"},
    /* 依赖（方法签名/局部变量） */
    {from:"Order",to:"PaymentGateway",kind:"dep",label:"支付参数"},
    {from:"OrderService",to:"Order",kind:"dep",label:"创建"},
  ],
};

/* ═══════════════════════════════════════════════════════════════
   ███ AI 数据区结束 —— 以下渲染引擎为固定模板，禁止改动。
   ═══════════════════════════════════════════════════════════════ */
const VIS={"+":"pub","-":"pri","#":"pro","~":"pkg"};
const rowsEl=document.getElementById("rows");
MODEL.rows.forEach(R=>{
  const row=document.createElement("div");row.className="row";
  R.forEach(id=>{
    const c=MODEL.classes[id],s=STEREO[c.stereo];
    const card=document.createElement("div");card.className="cls "+c.tier;card.id="cls-"+id;card.style.setProperty("--c",s.c);
    let body="";
    c.members.forEach(m=>{
      if(m[0]==="sect")body+=`<div class="sect">${m[1]}</div>`;
      else if(m[0]==="ellip")body+=`<div class="ellip">${m[1]}</div>`;
      else if(m[0]==="lit")body+=`<div class="member">${m[1]}</div>`;
      else{
        const v=(m[0].match(/[+\-#~]/)||["+"])[0];
        const cls=["member",m[0].includes("a")?"abstract-m":"",m[0].includes("s")?"static":""].join(" ");
        body+=`<div class="${cls}"><span class="vis ${VIS[v]}">${v}</span>${m[1]}${m[2]?`<span class="rtype">: ${m[2]}</span>`:""}</div>`;
      }
    });
    card.innerHTML=`<span class="tier-dot"></span>
      <div class="head"><span class="stereo">«${s.zh} ${s.en}»</span><div class="name">${c.name}</div><div class="desc">${c.desc}</div></div>
      <div class="body">${body}</div><div class="fold-hint">…成员已折叠</div>`;
    card.onclick=()=>{cycle(card);draw();};
    card.onmouseenter=()=>hl(id,true);card.onmouseleave=()=>hl(id,false);
    row.appendChild(card);
  });
  rowsEl.appendChild(row);
});
function cycle(card){
  if(card.classList.contains("folded")){card.classList.remove("folded");card.classList.add("semi");}
  else if(card.classList.contains("semi")){card.classList.remove("semi");card.classList.add("expanded");}
  else{card.classList.remove("expanded");card.classList.add("folded");}
}
function setAll(t){document.querySelectorAll(".cls").forEach(c=>{c.classList.remove("expanded","semi","folded");c.classList.add(t);});draw();}
function smartTier(){Object.entries(MODEL.classes).forEach(([id,c])=>{const el=document.getElementById("cls-"+id);
  el.classList.remove("expanded","semi","folded");el.classList.add(c.tier);});draw();}
function hl(id,on){
  const rel=new Set([id]);
  MODEL.edges.forEach(e=>{if(e.from===id||e.to===id){rel.add(e.from);rel.add(e.to);}});
  document.querySelectorAll(".cls").forEach(el=>{const cid=el.id.slice(4);
    el.classList.toggle("dim",on&&!rel.has(cid));el.classList.toggle("hl",on&&cid===id);});
  document.querySelectorAll("#edges .edge,#edges .edgepad").forEach(el=>{const e=MODEL.edges[+el.dataset.edge];
    if(e)el.style.opacity=on&&(e.from===id||e.to===id)?"1":"0.12";});
  document.querySelectorAll("#elabels text").forEach(t=>{const e=MODEL.edges[+t.dataset.edge];
    t.style.opacity=on&&e&&(e.from===id||e.to===id)?"1":"0.12";});
}

/* ── 连线：线层 z1（卡下）+ 标签层 z10（卡上）；专业 UML 记号 ── */
const svg=document.getElementById("edges");
const NS="http://www.w3.org/2000/svg";
const svgL=document.createElementNS(NS,"svg");
svgL.id="elabels";
document.getElementById("canvas").appendChild(svgL);
svg.innerHTML=`<defs>
  <marker id="tri" markerWidth="20" markerHeight="16" refX="18.5" refY="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M1.5,1.5 L18.5,8 L1.5,14.5 Z" fill="#fff" stroke="#475569" stroke-width="1.6"/></marker>
  <marker id="arr" markerWidth="13" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M1.5,1.5 L10,5 L1.5,8.5" fill="none" stroke="#475569" stroke-width="1.6"/></marker>
  <marker id="diaF" markerWidth="22" markerHeight="11" refX="0" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,5.5 L11,0.5 L22,5.5 L11,10.5 Z" fill="#475569" stroke="#475569" stroke-width="1.4"/></marker>
  <marker id="diaH" markerWidth="22" markerHeight="11" refX="0" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,5.5 L11,0.5 L22,5.5 L11,10.5 Z" fill="#fff" stroke="#475569" stroke-width="1.4"/></marker>
</defs>`;
function draw(){
  [...svg.querySelectorAll(".edge,.edgepad")].forEach(n=>n.remove());
  svgL.innerHTML="";
  const placed=[];   // 本次 draw 已放置标签的包围盒（跨边共享），后放标签对先放标签避让
  const cr=document.getElementById("canvas").getBoundingClientRect();
  // 卡片矩形统一转成画布局部坐标（与连线/标签同一坐标系），避让与防遮挡判定才不会错位
  const rects={};Object.keys(MODEL.classes).forEach(id=>{const el=document.getElementById("cls-"+id);
    if(el){const r=el.getBoundingClientRect();
      rects[id]={left:r.left-cr.left,top:r.top-cr.top,right:r.right-cr.left,bottom:r.bottom-cr.top};}});
  // 同一框的多条入边/出边错开锚点，避免落点重叠
  const inCnt={},inIdx={},outCnt={},outIdx={};
  MODEL.edges.forEach(e=>{inCnt[e.to]=(inCnt[e.to]||0)+1;outCnt[e.from]=(outCnt[e.from]||0)+1;});
  MODEL.edges.forEach(e=>{inIdx[e.to]=inIdx[e.to]||0;outIdx[e.from]=outIdx[e.from]||0;});
  const off=(cnt,idx)=>cnt<=1?0:(idx-(cnt-1)/2)*20;
  // 锚点槽位查重：同一张卡的同一物理边（top/bottom/left/right）上，已用锚点 20px 内不放新锚点。
  // 统一消除三类箭头叠印：钳制把多条边挤到同一边界、拱桥改走顶边丢错开、垂直/水平/拱桥混合进入互不感知。
  const anch={};
  const slot=(id,side,v,lo,hi)=>{
    const used=((anch[id]=anch[id]||{})[side]=anch[id][side]||[]);
    const ok=x=>x>=lo&&x<=hi&&used.every(u=>Math.abs(u-x)>=20);
    if(ok(v)){used.push(v);return v;}
    for(let dd=20;dd<=600;dd+=20){
      if(ok(v+dd)){used.push(v+dd);return v+dd;}
      if(ok(v-dd)){used.push(v-dd);return v-dd;}}
    used.push(v);return v;};   // 区间内确实放不下：保持原位
  const hitH=(y,x1,x2,skip)=>{for(const id in rects){if(skip.includes(id))continue;const r=rects[id];
    if(y>r.top+3&&y<r.bottom-3&&x2>Math.max(x1,r.left)+6&&Math.min(x2,r.right)-6>x1)return true;}return false;};
  // 过渡走廊登记：每条路径的全部水平/竖直段入册；后画的边选择 V-H-V 的 hy、H-V-H 的 vx、
  // 五段绕行的 x2、拱桥的 yTop 时避开已占走廊（互距<14px 且范围交叠即冲突），消除同一走廊叠线
  const corr={H:[],V:[]};
  const corrOK=(k,pos,a,b)=>!corr[k].some(c=>Math.abs(c.pos-pos)<20&&Math.min(c.b,b)-Math.max(c.a,a)>8);
  const corrPick=(k,want,lo,hi,a,b,ok,step)=>{
    step=step||20;
    const test=(c,soft)=>c>=lo&&c<=hi&&(soft||corrOK(k,c,a,b))&&(!ok||ok(c));
    if(test(want))return want;
    for(let dd=step;dd<=420;dd+=step){
      if(test(want-dd))return want-dd;
      if(test(want+dd))return want+dd;}
    for(let dd=step;dd<=420;dd+=step){   // 软兜底：走廊全占时放弃避让，只保证不穿卡/不越界
      if(test(want-dd,true))return want-dd;
      if(test(want+dd,true))return want+dd;}
    return want;};   // 实在无处可让：保持期望值
  const regSegs=dd=>{const toks=dd.match(/[ML]-?\d+(\.\d+)?,-?\d+(\.\d+)?/g)||[];
    const pts=toks.map(t=>t.match(/-?\d+(\.\d+)?/g).map(Number));
    for(let k=0;k+1<pts.length;k++){const [x1,y1]=pts[k],[x2,y2]=pts[k+1];
      if(Math.abs(y1-y2)<0.5&&Math.abs(x1-x2)>6)corr.H.push({pos:(y1+y2)/2,a:Math.min(x1,x2),b:Math.max(x1,x2)});
      else if(Math.abs(x1-x2)<0.5&&Math.abs(y1-y2)>6)corr.V.push({pos:(x1+x2)/2,a:Math.min(y1,y2),b:Math.max(y1,y2)});}};
  MODEL.edges.forEach((e,ei)=>{
    const a=document.getElementById("cls-"+e.from),b=document.getElementById("cls-"+e.to);
    if(!a||!b)return;
    const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
    const L=r=>r.left-cr.left, T=r=>r.top-cr.top;
    const ax=L(ra)+ra.width/2, ay=T(ra)+ra.height/2;
    const bx=L(rb)+rb.width/2, by=T(rb)+rb.height/2;
    const dx=bx-ax, dy=by-ay; let sx,sy,tx,ty,vert=Math.abs(dy)>Math.abs(dx)*0.9;
    const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));   // 锚点钳制在框边范围内
    const offS=off(outCnt[e.from],outIdx[e.from]), offT=off(inCnt[e.to],inIdx[e.to]);
    let d="",detour=false;
    // 带范围竖直碰撞：xx 列上 yA..yB 段是否撞卡（含源/目标卡——贴边容差已保证锚定处不误判，
    // 不 skip 才能拦住"绕行段穿过源/目标卡自身"）
    const hitVr=(xx,yA,yB)=>{const lo2=Math.min(yA,yB),hi2=Math.max(yA,yB);
      for(const id in rects){const r=rects[id];
        if(xx>r.left+4&&xx<r.right-4&&hi2>Math.max(lo2,r.top)+6&&Math.min(hi2,r.bottom)-6>lo2)return true;}return false;};
    // 上方拱桥：两卡锚点改走顶边（垂直进入），从行上方空隙横越 —— 水平受阻与跨多行兜底共用；
    // 目标头顶被卡挡死时退化为侧向绕行（从目标左/右外侧竖直下来，水平进侧边）
    const bridge=()=>{
      detour=true;
      const rowEl=a.closest(".row").getBoundingClientRect();
      const yTop0=Math.min(T(rowEl),Math.min(T(ra),T(rb)))-14;
      const sA0=slot(e.from,"top",cl(ax,L(ra)+20,L(ra)+ra.width-20),L(ra)+20,L(ra)+ra.width-20);
      const sA=corrPick("V",sA0,L(ra)+20,L(ra)+ra.width-20,yTop0,T(ra),c=>!hitVr(c,yTop0,T(ra)));
      const tA0=slot(e.to,"top",cl(bx+offT,L(rb)+20,L(rb)+rb.width-20),L(rb)+20,L(rb)+rb.width-20);
      const tA=corrPick("V",tA0,L(rb)+20,L(rb)+rb.width-20,yTop0,T(rb),c=>!hitVr(c,yTop0,T(rb)));
      const yTop=corrPick("H",yTop0,Math.max(6,yTop0-110),yTop0,Math.min(sA,tA),Math.max(sA,tA),
        c=>!hitH(c,Math.min(sA,tA)-2,Math.max(sA,tA)+2,[e.from,e.to]),8);
      if(hitVr(tA,yTop,T(rb))){   // 目标顶边竖直必穿卡 → 侧向绕行（先目标远端，再近端）
        const trySide=(s2)=>{     // s2=+1 右侧，-1 左侧
          const edge=s2>0?L(rb)+rb.width:L(rb);
          const ey=slot(e.to,s2>0?"right":"left",cl(by+offT,T(rb)+20,T(rb)+rb.height-20),T(rb)+20,T(rb)+rb.height-20);
          if(hitH(ey,Math.min(edge,edge+s2*16)-2,Math.max(edge,edge+s2*16)+2,[e.from,e.to]))return null;
          for(let dd=16;dd<=340;dd+=16){const c=edge+s2*dd;
            if(!hitVr(c,yTop,ey)&&!hitH(yTop,Math.min(c,sA)-2,Math.max(c,sA)+2,[e.from,e.to])
               &&!hitH(ey,Math.min(c,edge)-2,Math.max(c,edge)+2,[e.from,e.to])){
              return {ex:c,ey,edge};}}
          return null;};
        const side=trySide(bx>=ax?1:-1)||trySide(bx>=ax?-1:1);
        if(side){
          sx=sA; sy=T(ra); tx=side.edge; ty=side.ey;
          d=`M${sx},${sy} L${sx},${yTop} L${side.ex},${yTop} L${side.ex},${ty} L${tx},${ty}`;return;}
      }
      sx=sA; sy=T(ra); tx=tA; ty=T(rb);
      d=`M${sx},${sy} L${sx},${yTop} L${tx},${yTop} L${tx},${ty}`;};
    if(vert){ // 垂直连接：源底/顶边 → 目标顶/底边，最后一段垂直正交进入
      const down=dy>0;
      const ovL=Math.max(L(ra),L(rb)), ovR=Math.min(L(ra)+ra.width,L(rb)+rb.width);
      const x0=ovL+16<ovR?(ovL+ovR)/2:(ax+bx)/2;
      sy=down?T(ra)+ra.height:T(ra); ty=down?T(rb):T(rb)+rb.height;
      sx=slot(e.from,down?"bottom":"top",cl(x0+offS,L(ra)+20,L(ra)+ra.width-20),L(ra)+20,L(ra)+ra.width-20);
      tx=slot(e.to,down?"top":"bottom",cl(x0+offT,L(rb)+20,L(rb)+rb.width-20),L(rb)+20,L(rb)+rb.width-20);
      // 首尾竖直段也避让已画边的走廊（后画者让先画者）
      sx=corrPick("V",sx,L(ra)+20,L(ra)+ra.width-20,Math.min(sy,ty),Math.max(sy,ty));
      tx=corrPick("V",tx,L(rb)+20,L(rb)+rb.width-20,Math.min(sy,ty),Math.max(sy,ty));
      const hx1=Math.min(sx,tx)-2,hx2=Math.max(sx,tx)+2;
      if(Math.abs(sx-tx)<2 && !hitVr(sx,sy,ty)){
        d=`M${sx},${sy} L${sx},${ty}`;                       // 直垂线
      }else{
        // Z: V-H-V —— 从中点向两侧搜索水平缝 hy；竖直段只到 hy 为止，不按整列过严判定
        let hy=null;const mid=(sy+ty)/2,lo3=Math.min(sy,ty)+14,hi3=Math.max(sy,ty)-14;
        for(let k=0;k<60&&hy===null;k++){
          for(const yy of (k?[mid-8*k,mid+8*k]:[mid])){
            if(yy<lo3||yy>hi3)continue;
            if(!hitH(yy,hx1,hx2,[e.from,e.to])&&!hitVr(sx,sy,yy)&&!hitVr(tx,ty,yy)){hy=yy;break;}}}
        if(hy!==null){
          hy=corrPick("H",hy,lo3,hi3,Math.min(sx,tx),Math.max(sx,tx),
            c=>!hitH(c,hx1,hx2,[e.from,e.to])&&!hitVr(sx,sy,c)&&!hitVr(tx,ty,c));
          d=`M${sx},${sy} L${sx},${hy} L${tx},${hy} L${tx},${ty}`;   // Z: V-H-V
        }else{
          // 五段绕行：旁侧竖直走廊 + 两条短水平段（含撞卡校验）；走廊全堵则上方拱桥兜底
          let x2=null;const g=12,gs=sy+(down?g:-g),gt=ty+(down?-g:g);
          for(const pass of [false,true]){
            for(const dd of [34,-34,68,-68,102,-102,136,-136]){const c=(hitVr(sx,sy,ty)?tx:sx)+dd;
              if(!hitVr(c,gs,gt)
                 &&!hitH(gs,Math.min(sx,c)-2,Math.max(sx,c)+2,[e.from,e.to])
                 &&!hitH(gt,Math.min(tx,c)-2,Math.max(tx,c)+2,[e.from,e.to])
                 &&(pass||corrOK("V",c,Math.min(gs,gt),Math.max(gs,gt)))){x2=c;break;}}
            if(x2!==null)break;}
          if(x2===null)bridge();
          else{
            // gs/gt 水平段独立错开已占走廊（源端/目标端各自选偏移），避免与邻边横段叠线
            let gS=g,gT=g;
            for(const gg of [12,20,32,46,60,76,92]){
              if(gS===g&&corrOK("H",sy+(down?gg:-gg),Math.min(sx,x2),Math.max(sx,x2)))gS=gg;
              if(gT===g&&corrOK("H",ty+(down?-gg:gg),Math.min(tx,x2),Math.max(tx,x2)))gT=gg;
              if(gS!==g&&gT!==g)break;}
            if(hitVr(x2,sy+(down?gS:-gS),ty+(down?-gT:gT))){gS=g;gT=g;}   // 拉长后竖直走廊撞卡：回退
            const gs2=sy+(down?gS:-gS),gt2=ty+(down?-gT:gT);
            d=`M${sx},${sy} L${sx},${gs2} L${x2},${gs2} L${x2},${gt2} L${tx},${gt2} L${tx},${ty}`;}
        }
      }
    }else{ // 水平连接：源右/左边 → 目标左/右边，最后一段水平正交进入
      const right=dx>0;
      const ovT=Math.max(T(ra),T(rb)), ovB=Math.min(T(ra)+ra.height,T(rb)+rb.height);
      const y0=ovT+16<ovB?(ovT+ovB)/2:(ay+by)/2;
      sx=right?L(ra)+ra.width:L(ra); tx=right?L(rb):L(rb)+rb.width;
      // 注：拱桥改走顶边时，此处占用的 left/right 槽位虽未使用，仅造成轻微空置，不影响正确性
      sy=slot(e.from,right?"right":"left",cl(y0+offS,T(ra)+20,T(ra)+ra.height-20),T(ra)+20,T(ra)+ra.height-20);
      ty=slot(e.to,right?"left":"right",cl(y0+offT,T(rb)+20,T(rb)+rb.height-20),T(rb)+20,T(rb)+rb.height-20);
      // 首尾水平段也避让已画边的走廊（后画者让先画者）
      sy=corrPick("H",sy,T(ra)+20,T(ra)+ra.height-20,Math.min(sx,tx),Math.max(sx,tx));
      ty=corrPick("H",ty,T(rb)+20,T(rb)+rb.height-20,Math.min(sx,tx),Math.max(sx,tx));
      const blocked=(yy)=>hitH(yy,Math.min(sx,tx),Math.max(sx,tx),[e.from,e.to]);
      if(Math.abs(sy-ty)<2 && !blocked(sy)){
        d=`M${sx},${sy} L${tx},${ty}`;                       // 直水平线
      }else if(!blocked(sy)&&!blocked(ty)){
        let vx=(sx+tx)/2;
        const vOK=c=>!hitVr(c,sy,ty);   // 竖直段 y∈[sy,ty]，只判与该段相交的卡（不按全图 x 误杀）
        for(const dd of [0,34,-34,68,-68]){const c=(sx+tx)/2+dd;
          if(vOK(c)&&corrOK("V",c,Math.min(sy,ty),Math.max(sy,ty))){vx=c;break;}}
        if(Math.abs(sx-tx)>76) vx=cl(vx,Math.min(sx,tx)+38,Math.max(sx,tx)-38); // 过渡段与两框保持距离，避免贴角
        vx=corrPick("V",vx,Math.min(sx,tx)+6,Math.max(sx,tx)-6,Math.min(sy,ty),Math.max(sy,ty),vOK);
        if(!vOK(vx)){for(let c2=Math.min(sx,tx)+6;c2<=Math.max(sx,tx)-6;c2+=4){ // 细扫兜底：绝不穿卡
          if(vOK(c2)){vx=c2;break;}}}
        d=`M${sx},${sy} L${vx},${sy} L${vx},${ty} L${tx},${ty}`;   // Z: H-V-H
      }else bridge(); // 水平受阻 → 上方拱桥：锚点改走顶边（垂直进入），箭头自然落在顶边
    }
    if(d)regSegs(d);   // 路径定稿后登记全部水平/竖直段，供后续边避让
    const p=document.createElementNS(NS,"path");p.setAttribute("class","edge");
    p.setAttribute("d",d);p.setAttribute("fill","none");p.setAttribute("stroke","#64748B");p.setAttribute("stroke-width","1.6");
    p.dataset.edge=ei;
    const K=e.kind;
    if(K==="impl"||K==="dep"){ // 虚线 dash 相位随机，端头可能断在空档上：先垫两小段实线（画在虚线之下）保证与卡边/箭头接续
      try{const l2=p.getTotalLength(),q0=p.getPointAtLength(0),qs=p.getPointAtLength(6),
        qe=p.getPointAtLength(Math.max(6,l2-9)),q1=p.getPointAtLength(l2);
        const pad=document.createElementNS(NS,"path");pad.setAttribute("class","edgepad");pad.dataset.edge=ei;
        pad.setAttribute("d",`M${qs.x},${qs.y} L${q0.x},${q0.y} M${qe.x},${qe.y} L${q1.x},${q1.y}`);
        pad.setAttribute("fill","none");pad.setAttribute("stroke","#64748B");pad.setAttribute("stroke-width","1.6");
        svg.appendChild(pad);}catch(err){}
    }
    if(K==="general"||K==="impl"){if(K==="impl")p.setAttribute("stroke-dasharray","6 5");p.setAttribute("marker-end","url(#tri)");}
    else if(K==="compose"){p.setAttribute("marker-start","url(#diaF)");}
    else if(K==="aggregate"){p.setAttribute("marker-start","url(#diaH)");}
    else if(K==="assoc"){p.setAttribute("marker-end","url(#arr)");}
    else if(K==="dep"){p.setAttribute("stroke-dasharray","6 5");p.setAttribute("marker-end","url(#arr)");}
    svg.appendChild(p);
    // ── 标签防遮挡放置：实测文本宽度 → 与卡片矩形/已放标签求交 → 沿路径滑动、法向两侧偏移找空位 ──
    const put=(txt,x,y,col,ei)=>{if(!txt)return;const t=document.createElementNS(NS,"text");
      t.setAttribute("x",x);t.setAttribute("y",y);
      t.setAttribute("text-anchor","middle");t.setAttribute("dominant-baseline","central");t.setAttribute("font-size","11");
      t.setAttribute("font-family","Segoe UI,Microsoft YaHei,sans-serif");
      t.setAttribute("fill",col||"#64748B");t.setAttribute("paint-order","stroke");
      t.setAttribute("stroke","#F8FAFC");t.setAttribute("stroke-width","4");
      t.dataset.edge=ei;t.textContent=txt;svgL.appendChild(t);return t;};
    try{
      const len=p.getTotalLength();
      const wOf=(txt)=>{const t=put(txt,0,0,"#000",0);const w=t.getComputedTextLength();t.remove();return w;};
      // 碰撞盒判定：0 = 不压任何卡片/已放标签；>0 = 最大重叠面积
      const hitBox=(x,y,hw,hh)=>{const l=x-hw,r2=x+hw,tp=y-hh,bt=y+hh;let m=0;
        const hit=(c)=>{const ox=Math.min(r2,c.right)-Math.max(l,c.left),oy=Math.min(bt,c.bottom)-Math.max(tp,c.top);
          if(ox>0&&oy>0)m=Math.max(m,ox*oy);};
        for(const id in rects)hit(rects[id]);
        for(const c of placed)hit(c);
        return m;};
      const overlap=(x,y,w)=>hitBox(x,y,w/2+4,13);
      // 中文竖排放置（每字一行）：窄列间隙放不下横排时的兜底
      const putV=(txt,x,y,col,ei)=>{const t=document.createElementNS(NS,"text");
        t.setAttribute("text-anchor","middle");t.setAttribute("font-size","11");
        t.setAttribute("font-family","Segoe UI,Microsoft YaHei,sans-serif");
        t.setAttribute("fill",col||"#64748B");t.setAttribute("paint-order","stroke");
        t.setAttribute("stroke","#F8FAFC");t.setAttribute("stroke-width","4");
        t.dataset.edge=ei;
        [...txt].forEach((ch,i)=>{const ts=document.createElementNS(NS,"tspan");
          ts.setAttribute("x",x);ts.setAttribute("y",y+(i-(txt.length-1)/2)*13);ts.textContent=ch;t.appendChild(ts);});
        svgL.appendChild(t);};
      const tangentAt=(f)=>{const d1=Math.max(0.5,Math.min(len-0.5,f*len));
        const pt=p.getPointAtLength(d1),q=p.getPointAtLength(Math.max(0,d1-1));
        const tx2=pt.x-q.x,ty2=pt.y-q.y,tl=Math.hypot(tx2,ty2)||1;
        return {pt,nx:-ty2/tl,ny:tx2/tl};};
      // 候选：沿路径的位置序列（0..1）× 法向偏移（先近后远）；首个无碰撞即用，
      // 无空位时先就近网格搜索、再尝试中文竖排；放置后一律登记 placed，后续标签对它避让
      const spot=(txt,fracs,col,ei)=>{
        const w=wOf(txt);let best=null,done=false;
        for(const f of fracs){if(done)break;
          const {pt,nx,ny}=tangentAt(f);
          for(const s of [-14,14,-22,22,-30,30]){const x=pt.x+nx*s,y=pt.y+ny*s,ov=overlap(x,y,w);
            if(!best||ov<best.ov)best={x,y,ov};
            if(ov===0){done=true;break;}}}
        if(!best)return;
        if(best.ov>0){
          search:for(const dy of [0,-16,16,-32,32,-48,48])for(const dx of [0,12,-12,24,-24,36,-36]){
            if(overlap(best.x+dx,best.y+dy,w)===0){best.x+=dx;best.y+=dy;break search;}}
          if(overlap(best.x,best.y,w)>0&&/[\u4e00-\u9fff]/.test(txt)&&txt.length>1){
            const vh=txt.length*13+6;      // 竖排盒：宽~20，高=字数×13+6
            for(const f of fracs){const {pt,nx,ny}=tangentAt(f);
              for(const s of [-16,16]){const x=pt.x+nx*s,y=pt.y+ny*s;
                if(hitBox(x,y,10,vh/2)===0){
                  putV(txt,x,y,col,ei);
                  placed.push({left:x-10,right:x+10,top:y-vh/2,bottom:y+vh/2});return;}}}}}
        put(txt,best.x,best.y,col,ei);
        placed.push({left:best.x-w/2-4,right:best.x+w/2+4,top:best.y-13,bottom:best.y+13});};
      if(e.label)spot(e.label,[0.5,0.44,0.56,0.38,0.62,0.32,0.68,0.26,0.74,0.2,0.8,0.14,0.86],"#475569",ei);
      // 多重性贴各自端点（避开菱形/三角），由近及远向中段滑动；短边自然收敛到中点
      const dists=[32,42,52,24,62];
      const fr=dists.map(dd=>Math.min(len*0.45,dd)/len);
      if(e.multFrom)spot(e.multFrom,fr,"#94A3B8",ei);
      if(e.multTo)spot(e.multTo,fr.map(f=>1-f),"#94A3B8",ei);
    }catch(err){/* path 长度不可用时跳过标签 */}
    outIdx[e.from]++;inIdx[e.to]++;
  });
}
window.addEventListener("resize",draw);
document.fonts?document.fonts.ready.then(draw):0;
draw();
</script>
